<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage" role="img" data-i18n-aria="canvas.aria"></canvas>

<header class="bar">
  <h1>Agent World <span class="host" id="host"></span></h1>
  <span class="floorbadge" id="floorBadge"></span>
  <div class="chips" id="chips"></div>
  <button id="settings" class="settingsbtn" data-i18n-title="hdr.settings.tip" data-i18n-aria="hdr.settings.tip">⚙ <span data-i18n="hdr.settings"></span></button>
</header>

<!-- The view controls live in Settings → Controller. These elements keep their state; the menu drives them. -->
<div id="ctrlPool" hidden>
  <input type="checkbox" id="showSleep" checked>
  <button id="follow" data-i18n="hdr.follow"></button>
  <button id="overview" data-i18n="hdr.overview"></button>
  <button id="fired" data-i18n="hdr.fired"></button>
  <button id="demo" data-i18n="hdr.demo"></button>
</div>

<nav class="rooms" id="roomList" data-i18n-aria="rooms.aria"></nav>

<aside class="detail" id="detail" role="region" data-i18n-aria="detail.aria" hidden></aside>
<aside class="chat" id="chat" role="dialog" data-i18n-aria="chat.aria" hidden></aside>
<aside class="lift" id="lift" role="dialog" data-i18n-aria="lift.aria" hidden></aside>
<section class="modal" id="proj" role="dialog" data-i18n-aria="modal.aria" hidden></section>
<div class="fade" id="fade" aria-live="polite"></div>

<footer class="legend">
  <span><i style="background:var(--busy)"></i><em data-i18n="legend.busy"></em></span>
  <span><i style="background:var(--idle)"></i><em data-i18n="legend.idle"></em></span>
  <span><i style="background:var(--recent)"></i><em data-i18n="legend.recent"></em></span>
  <span><i style="background:var(--sleep)"></i><em data-i18n="legend.sleeping"></em></span>
  <span><i style="background:#ffb020;border-radius:3px"></i><em data-i18n="legend.ask"></em></span>
  <span><i style="background:#3ddc97;border-radius:3px"></i><em data-i18n="legend.done"></em></span>
  <span class="hint" data-i18n="legend.hint"></span>
  <span class="upd" id="upd"></span>
</footer>

<div class="err" id="err" role="alert" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
